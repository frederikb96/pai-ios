name: Check

# Compiles and tests the PAIKit package on macOS. This exists because the package was written
# entirely without a Mac — no Swift toolchain exists on either peer — so this workflow is the
# only thing that can tell us whether any of it is real.
#
# Deliberately does no signing and needs no App Store Connect key, so it works long before the
# release pipeline can.
#
# Cost: macOS minutes bill at 10x ($0.062/min). A run is a few minutes, and a private repo has
# 200-300 macOS minutes free per month — roughly 40-60 runs. Not free, but close enough to use
# as a compiler.
on:
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - 'Package.swift'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - '**/*.swift'
      - 'Package.swift'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build --build-tests 2>&1 | tee /tmp/build.log

      - name: Test
        run: swift test --skip-build

      # A failed build's errors scroll past in the step log; this makes them the first thing
      # visible in the run summary, since reading them is the entire point of this workflow.
      - name: Surface compiler errors
        if: failure()
        run: |
          echo '## Compiler output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E 'error:|warning:' /tmp/build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
