name: Mac

# Everything that genuinely needs Apple hardware — building the app target, and running it in a
# simulator to see what it draws.
#
# 🚨 **Not triggered by pushes to main, deliberately.** A Mac run takes ten to thirty minutes and
# queues for a scarcer machine, so firing one on every commit buries the answer you wanted under
# twenty you did not. Work on a branch, then ask for one run when there is something worth
# looking at — `gh workflow run mac.yml` — or open a pull request. Batch the questions into that
# one run rather than spending several to answer them one at a time.
#
# One job, one checkout, one build. An earlier split into "compile it" and "run it" workflows
# built the app twice on every push, for nothing. `Tooling/sim/` holds the simulator lane, so the
# same scripts run here and on any other Mac. `only` and `script` narrow a dispatch to one question.
on:
  # Called from `free-checks.yml` on pull requests that change the app; concurrency is set there.
  workflow_call:
  workflow_dispatch:
    inputs:
      run_app:
        description: 'Boot a simulator and run the app (slower; skip for a compile-only check)'
        type: boolean
        default: true
      configuration:
        description: 'Build configuration. Release before a release — DEBUG-only code compiles out, and that error surfaces nowhere else.'
        type: choice
        options: [Debug, Release]
        default: Debug
      only:
        description: 'Comma-separated sections or screens from Tooling/sim/sweep.sh; empty runs all. Also skips the Mac-only tests.'
        type: string
        default: ''
      script:
        description: 'Repo path of a probe sourced after the sweep. Also skips the Mac-only tests.'
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: actions/cache/restore@v6
        id: xcode-cache
        with:
          path: |
            build/dd/SourcePackages
            build/dd/CompilationCache.noindex
          key: xcode-${{ runner.os }}-${{ hashFiles('PAIKit/Package.swift', 'PAI.xcodeproj/project.pbxproj') }}-${{ github.run_id }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ hashFiles('PAIKit/Package.swift', 'PAI.xcodeproj/project.pbxproj') }}-
            xcode-${{ runner.os }}-

      # A boot is minutes of waiting, not of work, so it overlaps the build.
      - name: Start a simulator
        id: sim
        if: inputs.run_app != false
        run: echo "udid=$(Tooling/sim/boot.sh start)" >> "$GITHUB_OUTPUT"

      # Everything else in the package is already green from free-checks, so this builds only the
      # app target — the part that needs an iOS SDK.
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project PAI.xcodeproj -scheme PAI \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "${{ inputs.configuration || 'Debug' }}" -derivedDataPath build/dd \
            COMPILATION_CACHE_ENABLE_CACHING=YES \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log | tail -20

      # Saved here rather than at the end of the job, so a red sweep keeps what the build produced.
      - uses: actions/cache/save@v6
        with:
          path: |
            build/dd/SourcePackages
            build/dd/CompilationCache.noindex
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}

      - name: Surface compiler errors
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -40 || echo "no compiler errors in the log"

      # 🚨 The one property of this app that cannot be seen in a screenshot, cannot be tested in a
      # simulator, and fails as "iOS suspended us" rather than as an error: whether the built
      # bundle actually declares the audio background mode. Without it a voice recording ends the
      # moment the app leaves the screen, which is the single thing recording on the phone is for.
      #
      # It checks a key from `Config/Info.plist` AND one that only `GENERATE_INFOPLIST_FILE`
      # produces, because the risk runs both ways: naming an `INFOPLIST_FILE` could stop the
      # generated keys being merged in, and losing the microphone usage description that way is a
      # crash on first record plus a rejected submission.
      - name: The built bundle declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          plutil -p "$app/Info.plist" > /tmp/built-info.txt
          grep -q '"audio"' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes is missing "audio" — recording will not survive backgrounding'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q '"remote-notification"' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes is missing "remote-notification" — a silent push never wakes the app, which reads as the read-sync push not working rather than as a missing declaration'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'NSMicrophoneUsageDescription' /tmp/built-info.txt \
            || { echo '::error::the generated Info.plist keys were not merged in'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'NSCameraUsageDescription' /tmp/built-info.txt \
            || { echo '::error::NSCameraUsageDescription is missing — iOS kills the app when the camera opens'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q '"pai"' /tmp/built-info.txt \
            || { echo '::error::the pai:// URL scheme is missing — every note shortcut opens nothing'; \
                 cat /tmp/built-info.txt; exit 1; }
          # App Store Connect rejects an upload (ITMS-90208) when an embedded framework's
          # MinimumOSVersion is empty or below the app's own, and says so only by email afterwards.
          app_min=$(plutil -extract MinimumOSVersion raw "$app/Info.plist")
          for plist in "$app"/Frameworks/*.framework/Info.plist; do
            [ -f "$plist" ] || continue
            fw_min=$(plutil -extract MinimumOSVersion raw "$plist" 2>/dev/null || true)
            echo "$(basename "$(dirname "$plist")") MinimumOSVersion=${fw_min:-<missing>}"
            lowest=$(printf '%s\n%s\n' "$fw_min" "$app_min" | sort -V | head -1)
            [ -n "$fw_min" ] && { [ "$fw_min" = "$app_min" ] || [ "$lowest" = "$app_min" ]; } \
              || { echo "::error::$plist declares MinimumOSVersion '${fw_min}' below the app's $app_min — App Store Connect will reject the upload"; exit 1; }
          done
          # An extension with no display name is refused at install time with an error that names
          # neither the key nor the file, and one missing its extension point never reaches the
          # share sheet at all.
          share="$app/PlugIns/PAIShare.appex/Info.plist"
          [ -f "$share" ] || { echo '::error::the app does not embed PAIShare.appex'; exit 1; }
          plutil -p "$share" > /tmp/built-share-info.txt
          grep -q '"CFBundleDisplayName" => "PAI"' /tmp/built-share-info.txt \
            || { echo '::error::the share extension has no display name'; cat /tmp/built-share-info.txt; exit 1; }
          grep -q 'com.apple.share-services' /tmp/built-share-info.txt \
            || { echo '::error::the share extension declares no extension point'; cat /tmp/built-share-info.txt; exit 1; }
          grep -q 'NSExtensionActivationSupportsFileWithMaxCount' /tmp/built-share-info.txt \
            || { echo '::error::the share extension has no activation rule'; cat /tmp/built-share-info.txt; exit 1; }
          share_build=$(plutil -extract CFBundleVersion raw "$share")
          app_build=$(plutil -extract CFBundleVersion raw "$app/Info.plist")
          [ "$share_build" = "$app_build" ] \
            || { echo "::error::the extension's build $share_build differs from the app's $app_build"; exit 1; }
          echo 'background modes, URL scheme, generated keys, framework minimum OS and share extension all present'

      # Runs after the app build on purpose. This step compiles the whole package on a macOS host,
      # which is the only place the UIKit-guarded files compile at all — so it fails for reasons
      # that have nothing to do with the app target, and running it first means one bad constant
      # costs the entire run's information. The job still fails if this fails; it just fails
      # having already answered the expensive question.
      #
      # 🚨 The streaming tests run on the free Linux runner too, and this is NOT redundant with
      # that. Linux and Darwin ship different `URLSession` implementations, and a divergence
      # between them is exactly what shipped a client that connected, reported itself live and
      # delivered nothing forever — green on one says nothing about the other. This is the only
      # place the streaming clients meet Apple's own URL loading system. Keep it.
      #
      # The notes cache's file storage runs here too: atomic renames, directory listings and file
      # sizes are Foundation's platform shims, which differ between the two.
      - name: Test what Linux cannot
        if: ${{ !inputs.only && !inputs.script }}
        run: swift test --package-path PAIKit --filter 'Sse|Terminal|NotesCacheStorage'

      - name: Wait for the simulator
        if: inputs.run_app != false
        run: Tooling/sim/boot.sh wait "${{ steps.sim.outputs.udid }}"

      - name: Install the app
        if: inputs.run_app != false
        run: Tooling/sim/install.sh "${{ steps.sim.outputs.udid }}" build/dd

      - name: Screenshot every screen fixture mode can reach
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Debug'
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
          ONLY: ${{ inputs.only }}
          PROBE: ${{ inputs.script }}
        run: Tooling/sim/sweep.sh

      # No fixture mode and no debug bridge in Release — this is the plain "does it draw
      # anything" check the Debug path above replaces with one screenshot per screen.
      - name: Screenshot the running app
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Release'
        run: |
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch "$udid" com.frederikberg.pai
          # launch returns once the process exists, which is before it has drawn anything.
          sleep 8
          xcrun simctl io "$udid" screenshot artifacts/screen.png
          bytes=$(stat -f %z artifacts/screen.png)
          echo "screenshot is $bytes bytes"
          [ "$bytes" -gt 20000 ] || { echo 'suspiciously small — the screen may be blank'; exit 1; }

      - name: Application logs
        if: always() && inputs.run_app != false
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 3m --style compact \
            --predicate 'processImagePath CONTAINS "PAI"' > artifacts/app.log 2>&1 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mac-artifacts
          path: artifacts/
          retention-days: 14
