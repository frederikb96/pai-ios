name: Mac

# Everything that genuinely needs Apple hardware — building the app target, and running it in a
# simulator to see what it draws.
#
# 🚨 **Not triggered by pushes to main, deliberately.** A Mac run takes ten to thirty minutes and
# queues for a scarcer machine, so firing one on every commit buries the answer you wanted under
# twenty you did not. Work on a branch, then ask for one run when there is something worth
# looking at — `gh workflow run mac.yml` — or open a pull request. Batch the questions into that
# one run rather than spending several to answer them one at a time.
#
# One job, one checkout, one build. An earlier split into "compile it" and "run it" workflows
# built the app twice on every push, for nothing.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_app:
        description: 'Boot a simulator and run the app (slower; skip for a compile-only check)'
        type: boolean
        default: true
      configuration:
        description: 'Build configuration. Release before a release — DEBUG-only code compiles out, and that error surfaces nowhere else.'
        type: choice
        options: [Debug, Release]
        default: Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: dd-${{ runner.os }}-${{ hashFiles('PAIKit/Package.swift', 'PAI.xcodeproj/project.pbxproj') }}
          restore-keys: dd-${{ runner.os }}-

      # Everything else in the package is already green from free-checks, so this builds only the
      # app target — the part that needs an iOS SDK.
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild -project PAI.xcodeproj -scheme PAI \
            -destination 'generic/platform=iOS Simulator' \
            -configuration "${{ inputs.configuration || 'Debug' }}" -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee /tmp/build.log | tail -20

      - name: Surface compiler errors
        if: failure()
        run: |
          grep -E "error:" /tmp/build.log | head -40 || echo "no compiler errors in the log"

      # 🚨 The one property of this app that cannot be seen in a screenshot, cannot be tested in a
      # simulator, and fails as "iOS suspended us" rather than as an error: whether the built
      # bundle actually declares the audio background mode. Without it a voice recording ends the
      # moment the app leaves the screen, which is the single thing recording on the phone is for.
      #
      # It checks a key from `Config/Info.plist` AND one that only `GENERATE_INFOPLIST_FILE`
      # produces, because the risk runs both ways: naming an `INFOPLIST_FILE` could stop the
      # generated keys being merged in, and losing the microphone usage description that way is a
      # crash on first record plus a rejected submission.
      - name: The built bundle declares what it needs
        run: |
          set -o pipefail
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          plutil -p "$app/Info.plist" > /tmp/built-info.txt
          grep -q '"audio"' /tmp/built-info.txt \
            || { echo '::error::UIBackgroundModes is missing "audio" — recording will not survive backgrounding'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q 'NSMicrophoneUsageDescription' /tmp/built-info.txt \
            || { echo '::error::the generated Info.plist keys were not merged in'; \
                 cat /tmp/built-info.txt; exit 1; }
          grep -q '"pai"' /tmp/built-info.txt \
            || { echo '::error::the pai:// URL scheme is missing — every note shortcut opens nothing'; \
                 cat /tmp/built-info.txt; exit 1; }
          echo 'background mode, URL scheme and generated keys all present'

      # Runs after the app build on purpose. This step compiles the whole package on a macOS host,
      # which is the only place the UIKit-guarded files compile at all — so it fails for reasons
      # that have nothing to do with the app target, and running it first means one bad constant
      # costs the entire run's information. The job still fails if this fails; it just fails
      # having already answered the expensive question.
      #
      # 🚨 The streaming tests run on the free Linux runner too, and this is NOT redundant with
      # that. Linux and Darwin ship different `URLSession` implementations, and a divergence
      # between them is exactly what shipped a client that connected, reported itself live and
      # delivered nothing forever — green on one says nothing about the other. This is the only
      # place the streaming clients meet Apple's own URL loading system. Keep it.
      - name: Test what Linux cannot
        run: swift test --package-path PAIKit --filter 'Sse|Terminal'

      - name: Boot a simulator
        id: sim
        if: inputs.run_app != false
        run: |
          # Chosen from what the image actually has: runner images change their device list
          # between releases, and a hardcoded name fails late and confusingly.
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          devices = json.load(sys.stdin)['devices']
          for runtime in sorted(devices, reverse=True):
              if 'iOS' not in runtime: continue
              for d in devices[runtime]:
                  if d.get('isAvailable') and 'iPhone' in d['name']:
                      print(d['udid']); raise SystemExit
          ")
          [ -n "$udid" ] || { echo 'no iPhone simulator available'; exit 1; }
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          # Freddy runs the app in dark mode, and every design judgement made from a light
          # screenshot is a judgement about a screen nobody looks at. The palette carries a
          # genuine light appearance too, so this is a choice about which one gets photographed,
          # not about which one works.
          xcrun simctl ui "$udid" appearance dark

      - name: Install the app
        if: inputs.run_app != false
        run: |
          udid="${{ steps.sim.outputs.udid }}"
          app=$(find build/dd/Build/Products -name '*.app' -maxdepth 3 | head -1)
          [ -n "$app" ] || { echo 'build produced no .app'; exit 1; }
          xcrun simctl install "$udid" "$app"

      # Fixture mode, the launch-argument router and the debug bridge are all `#if DEBUG` — none
      # of them exist in a Release build, so this only runs for Debug. One launch per screen,
      # each with `-PaiFixtureMode` so the app answers from `PaiFixtures` instead of the network,
      # and `-PaiFixtureRoute <name>` to seed the navigation path straight to that screen. The
      # first launch (no route — the root session list) also asks the bridge's `/screens` for the
      # rest of the list, so a screen becomes photographable the moment its `Route` case exists,
      # with no edit here.
      #
      # Every screen is attempted even after one fails: a run that stops at the second of five
      # screens has already spent the minutes for all five and answered the fewest questions per
      # minute it could have. Failures accumulate in `$fail` and the job fails once, at the end.
      - name: Screenshot every screen fixture mode can reach
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Debug'
        run: |
          set -o pipefail
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          bundle=com.frederikberg.pai
          fail=0

          screenshot() {
            name="$1"; shift
            xcrun simctl launch "$udid" "$bundle" -PaiFixtureMode "$@" > /dev/null
            ok=0
            for attempt in $(seq 1 10); do
              if curl -sS --max-time 3 "http://127.0.0.1:8765/health" -o "artifacts/health-$name.json"; then
                # Why the app is on whatever screen it is on. A gate that never opens renders a
                # real screen, passes every check and satisfies the size floor — so without this
                # a wrong screen is indistinguishable from the right one.
                curl -sS --max-time 3 "http://127.0.0.1:8765/fixture" -o "artifacts/fixture-$name.json" || true
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::warning::$name: debug bridge never answered"
              fail=1
            fi
            # 🚨 The bridge starts listening in `PAIApp.init()`, BEFORE the first frame is drawn —
            # so "/health answered" proves the process is alive and proves nothing about the
            # screen. Without this settle the screenshot is a race the app usually wins and
            # occasionally loses, producing a black PNG that is indistinguishable from a genuinely
            # broken screen and costs an investigation to dismiss.
            sleep 6
            xcrun simctl io "$udid" screenshot "artifacts/screen-$name.png"
            # A screen caught before its first frame is a black PNG that still compresses to tens
            # of kilobytes, so the size floor below cannot see it — and it is indistinguishable
            # from a screen that genuinely renders nothing, which would otherwise cost another
            # whole run to tell apart. One retake settles it: a real blank screen is blank twice.
            if [ "$(stat -f %z "artifacts/screen-$name.png")" -le 100000 ]; then
              sleep 5
              xcrun simctl io "$udid" screenshot "artifacts/screen-$name.png"
            fi
            # Read AFTER the screenshot, not with the health probe: the bridge answers the moment
            # it is listening, which is before the screen has fetched, measured or drawn anything
            # worth logging. This is what distinguishes "nothing arrived" from "nothing measured"
            # from "nothing drawn" — three causes a picture cannot tell apart.
            curl -sS --max-time 3 "http://127.0.0.1:8765/logs?level=info&limit=200" \
              -o "artifacts/logs-$name.json" || true
            bytes=$(stat -f %z "artifacts/screen-$name.png")
            echo "$name: ${bytes} bytes"
            # A wholly blank screen still produces a valid PNG, just a small one — the one thing
            # every other check here can pass while the screen renders nothing.
            #
            # 🚨 It catches only a screen that is blank ALL OVER. A screen that draws its
            # navigation bar and composer but none of its content is several times this size and
            # sails past — which has happened. The size floor is the cheap half; `logs-<name>.json`
            # above is the half that actually distinguishes an empty screen from a full one.
            if [ "$bytes" -le 20000 ]; then
              echo "::warning::$name: screenshot suspiciously small — the screen may be blank"
              fail=1
            fi
          }

          screenshot root
          curl -sS --max-time 5 "http://127.0.0.1:8765/screens" -o artifacts/screens.json \
            || echo '{"screens":[]}' > artifacts/screens.json

          # Does the measured row height agree with what the view actually draws? Nothing checked
          # that until a nested list proved it false — the transcript lays out from analytic
          # heights and never asks a cell its size, so a disagreement is invisible to every other
          # check here and shows up as the reader being dragged around. Nested lists and a quote
          # are the shapes that were wrong; keep an easy case first so a failure is legible.
          printf 'Plain paragraph.\n' > /tmp/m1.md
          printf -- '- one\n- two\n  - nested a\n  - nested b\n    - deeper\n' > /tmp/m2.md
          printf -- '> quoted\n>\n> - a list inside a quote\n>   - and deeper\n' > /tmp/m3.md
          for m in 1 2 3; do
            curl -sS --max-time 5 --data-binary "@/tmp/m$m.md" \
              "http://127.0.0.1:8765/markdown/measure?width=360" \
              -o "artifacts/measure-$m.json" || true
          done

          # Spec row 16.2's own ask, on this device rather than reasoned about: how much a
          # debounced repaint costs with the note-editor gutter and hanging indent on, against
          # the same note with them off. A large note — dozens of list items long enough to wrap,
          # the shape that exercises the hanging indent — not a short one nothing would notice.
          python3 -c "
          lines = []
          for section in range(1, 40):
              lines.append(f'## Section {section}')
              lines.append('')
              for i in range(1, 8):
                  lines.append(
                      f'- item {section}.{i} with enough prose in it to wrap across more than one '
                      'visual line on a phone width, which is the shape that exercises the hanging '
                      'indent this measures rather than a short bullet that never wraps at all')
              lines.append('')
              lines.append(
                  'Ordinary prose between the lists, several sentences long, so the note is not '
                  'entirely list markup and reads like something written over weeks of real use '
                  'rather than a synthetic worst case built only to be slow.')
              lines.append('')
          open('/tmp/large-note.md', 'w').write('\n'.join(lines))
          "
          wc -c /tmp/large-note.md
          curl -sS --max-time 15 --data-binary "@/tmp/large-note.md" \
            "http://127.0.0.1:8765/markdown/note-editor-timing?width=350" \
            -o artifacts/note-editor-timing.json || true
          cat artifacts/note-editor-timing.json || true
          xcrun simctl terminate "$udid" "$bundle" || true

          names=$(python3 -c "import json; print('\n'.join(json.load(open('artifacts/screens.json'))['screens']))")
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            screenshot "$name" -PaiFixtureRoute "$name"
            xcrun simctl terminate "$udid" "$bundle" || true
          done <<< "$names"

          [ "$fail" -eq 0 ] || { echo 'one or more screens failed — see the warnings above'; exit 1; }

      # No fixture mode and no debug bridge in Release — this is the plain "does it draw
      # anything" check the Debug path above replaces with one screenshot per screen.
      - name: Screenshot the running app
        if: inputs.run_app != false && (inputs.configuration || 'Debug') == 'Release'
        run: |
          mkdir -p artifacts
          udid="${{ steps.sim.outputs.udid }}"
          xcrun simctl launch "$udid" com.frederikberg.pai
          # launch returns once the process exists, which is before it has drawn anything.
          sleep 8
          xcrun simctl io "$udid" screenshot artifacts/screen.png
          bytes=$(stat -f %z artifacts/screen.png)
          echo "screenshot is $bytes bytes"
          [ "$bytes" -gt 20000 ] || { echo 'suspiciously small — the screen may be blank'; exit 1; }

      - name: Application logs
        if: always() && inputs.run_app != false
        run: |
          mkdir -p artifacts
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --last 3m --style compact \
            --predicate 'processImagePath CONTAINS "PAI"' > artifacts/app.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-artifacts
          path: artifacts/
          retention-days: 14
