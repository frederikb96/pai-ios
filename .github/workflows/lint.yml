name: Lint

# Runs on Linux, on the self-hosted runner in Freddy's cluster — free and unmetered. Keeping the
# fast feedback here rather than on macOS is the whole point: macOS minutes bill at 10x, so the
# metered runner stays release-only. pai-android has no PR CI at all; this is the cheap version
# of the thing it never got.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: swift:6.2-noble

    steps:
      - uses: actions/checkout@v6

      - name: swift-format lint
        run: |
          # swift-format ships with the Swift toolchain from 6.0 onward.
          if command -v swift-format >/dev/null 2>&1; then
            swift-format lint --recursive --strict PAI PAITests
          else
            echo "::warning::swift-format not present in this image; skipping"
          fi

      - name: Sanity-check resolved packages
        run: |
          if [ -f Package.resolved ]; then
            python3 -c "import json,sys; json.load(open('Package.resolved')); print('Package.resolved parses')"
          else
            echo "no Package.resolved yet"
          fi
