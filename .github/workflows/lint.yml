name: Lint

# Runs on the self-hosted ARC runner in Freddy's cluster — free and unmetered — so that a
# formatting mistake is caught on a push rather than failing a metered macOS release run after
# it has already spun up. macOS minutes bill at 10x; this is the whole reason lint lives here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: arc-runner-pai-ios
    timeout-minutes: 5
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swift:
              - '**/*.swift'
              - '**/Package.swift'
              - '.swift-format'
              # This workflow filters itself, so that a change to it is actually exercised.
              # Without this line a fix here cannot be tested by pushing it.
              - '.github/workflows/lint.yml'

  format:
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: arc-runner-pai-ios
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      # The ARC runner image carries only git, bash and the runner binary — none of the ~200
      # tools a hosted ubuntu-latest image pre-installs. Swift needs its runtime dependencies
      # installed explicitly; the runner user has passwordless sudo.
      # Swift's own documented Ubuntu dependency list, plus `curl`, `file` and `ca-certificates`
      # for the setup action itself — it downloads a toolchain, verifies its signature, and
      # identifies the archive with `file`.
      #
      # Everything here is needed because the ARC image carries only git, bash and the runner
      # binary, where a hosted image would already have all of it. A missing package surfaces
      # late and unhelpfully: as "Unable to locate executable file", or as the freshly unpacked
      # toolchain failing to load a shared library.
      - name: Install Swift toolchain dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates curl file gnupg2 libc6-dev libcurl4-openssl-dev libedit2 \
            libgcc-13-dev libncurses-dev libpython3-dev libsqlite3-0 libstdc++-13-dev \
            libxml2-dev libz3-dev pkg-config tzdata unzip zlib1g-dev

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      # swift-format ships inside the toolchain from Swift 6.0 onward, so no separate install.
      - name: Format check
        run: swift format lint --recursive --strict PAIKit

      # swift-format can fix everything it reports, but there is no Swift toolchain on either
      # peer to run it on. Publishing the correction as a patch means a formatting failure is
      # resolved with `gh run download` and `git apply`, rather than by hand-editing from line
      # numbers — which is slow, and wrong often enough to need another round to find out.
      - name: Publish the correction as a patch
        if: failure()
        run: |
          swift format --in-place --recursive PAIKit
          git diff > format.patch

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: format-patch
          path: format.patch
          retention-days: 5
