name: Release

# Tag-triggered like pai-android, PLUS workflow_dispatch — pai-android has only the tag trigger,
# and because a pushed tag cannot be reused a failed release build there produced a tag literally
# named "v0.15.0-fix". macOS minutes are metered, so being able to exercise this without minting
# throwaway tags matters more here than it did on the free self-hosted Android runner.
on:
  push:
    tags: ['v*.*.*']
  # TestFlight builds expire after 90 days. Four documents said rebuilding was "a CI job, not a
  # chore" while no job existed — this is that job. Runs well inside the window so a failure has
  # room to be noticed and retried.
  schedule:
    - cron: '17 4 1 */2 *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 0.1.0). Ignored for tag pushes.'
        required: true
        default: '0.0.1'
      upload:
        description: 'Upload to TestFlight'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    # A hung job at the 6-hour default costs roughly $22 on a metered macOS runner.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      # The runner image's default Xcode changes underneath you; pin it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      # fastlane is pinned in the Gemfile rather than installed via brew, so CI and the rented
      # Mac resolve the same versions.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # The git tag is the single source of truth for the marketing version. pai-android keeps
      # versionName/versionCode hand-edited in build.gradle.kts and uses the tag only to name the
      # artifact — 75 tags meant 75 manual bumps of a monotonic counter, with nothing verifying
      # the two agreed. run_number gives a monotonic build number for free.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "marketing=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"
          fi
          echo "build=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # No test step: the package and its tests run on every push to main in `free-checks`,
      # on a free runner. Repeating them here would rebuild the whole package on a runner
      # billing at 10× to re-prove what is already green on this commit. The release-config
      # compile error a debug build would miss is still caught — by `fastlane build` below,
      # which archives Release.

      - name: Build and sign
        run: bundle exec fastlane build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      # 🚨 UPLOADING IS NOT DISTRIBUTING. The lane sets `skip_waiting_for_build_processing`
      # deliberately — waiting costs 10-30 minutes on a runner billed at 10x — which also means
      # fastlane cannot attach the build to a beta group, because Apple has not finished
      # processing it yet. A build that is uploaded and VALID but attached to no group is
      # installable by NOBODY, and looks identical to a successful release from every angle
      # available here: the job is green, App Store Connect lists the build, and the phone shows
      # nothing.
      #
      # So after this job finishes, attach it — the build id comes from
      # `asc.py builds 6806630985`, the group id from `asc.py groups 6806630985`:
      #
      #   asc.py post "betaGroups/<group-id>/relationships/builds" \
      #     '{"data":[{"type":"builds","id":"<build-id>"}]}'
      #
      # Verify with `asc.py get "betaGroups/<group-id>/builds"` — the reverse relationship is
      # 403 and cannot be read from the build's side. This is not automated; it is one HTTPS call
      # and could run on the free Linux runner once someone writes it.
      - name: Upload to TestFlight
        if: github.ref_type == 'tag' || github.event.inputs.upload == 'true'
        run: bundle exec fastlane upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          IOS_BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build }}

      # The .ipa is useless outside TestFlight and ~50 MB per tag. The dSYMs are what you actually
      # want later, for symbolicating a crash report.
      # gym writes its own dSYM zip into output_directory alongside the ipa. Globbing for an
      # .xcarchive under build/ found nothing and failed silently, attaching no artifact.
      - name: GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*.dSYM.zip

  # Uploading is not distributing, and the difference is invisible: a build can be VALID in App
  # Store Connect, listed by every query, and installable by nobody. This job closes that gap.
  #
  # Its own runner, and a plain Ubuntu one: attaching a build is authenticated HTTPS and needs no
  # Apple hardware, so doing it here bills at 1x instead of 10x — and the waiting this job does
  # (Apple's processing, minutes) is precisely the wait the upload lane refuses to do on macOS.
  #
  # A red job here means the build shipped but reached nobody, which is worth seeing rather than
  # swallowing.
  distribute:
    needs: build
    if: github.ref_type == 'tag' || github.event.inputs.upload == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - run: pip install --quiet 'pyjwt[crypto]'

      # The build number is the run number, set by the build job from the same source.
      - name: Attach the build to the beta group
        run: python3 Tooling/distribute-build.py "${{ github.run_number }}"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
